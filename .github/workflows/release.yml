name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binary
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Windows Binaries
        run: |
          go build -ldflags="-H windowsgui -s -w" -o Antigravity-Manager.exe ./cmd/agy-tools
          go build -ldflags="-s -w" -o agy-tools.exe ./cmd/agy-tools

      - name: Package Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./release_pkg -Force | Out-Null
          Copy-Item ./Antigravity-Manager.exe ./release_pkg/
          Copy-Item ./agy-tools.exe ./release_pkg/
          Copy-Item ./start-manager.bat ./release_pkg/
          Copy-Item ./stop-manager.bat ./release_pkg/
          Copy-Item ./LICENSE ./release_pkg/
          Compress-Archive -Path ./release_pkg/* -DestinationPath ./Antigravity-Manager-${{ github.ref_name }}-windows-amd64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Antigravity Manager ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Antigravity-Manager-*.zip
